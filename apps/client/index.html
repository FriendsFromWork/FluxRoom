<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0e0c15" />
    <script>
      // Apply the saved theme before first paint, so the page (and the per-theme logo) never
      // flashes the wrong theme while React loads. Must match ThemeProvider's storage key and default.
      (function () {
        var theme = 'dark';
        try {
          var stored = localStorage.getItem('fluxroom-theme');
          if (stored === 'light' || stored === 'dark' || stored === 'system') theme = stored;
          if (theme === 'system') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        } catch (e) {}
        document.documentElement.classList.add(theme);
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#0e0c15' : '#fbfaff');
      })();
    </script>
    <title>Fluxroom — share files, text, code &amp; chat in real time</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
